<!doctype html>
<html>
	<head>
		<link href="calc.css" rel="stylesheet">
		<script src="calc.js" defer></script>
	</head>
	<body>
		<div>
			<input type="number" id="left-input">

			<select id="operators">
				<option disabled selected hidden>
					--select operators--
				</option>
				<option value="-">-</option>
				<option value="*">*</option>
				<option value="/">/</option>
				<option value="%">%</option>
			</select>

			<input type="number" id="right-input">

			<button type="submit">Try me!</button>
		</div>
	</body>
</html>
