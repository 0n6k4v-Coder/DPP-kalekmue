<!doctype html>
<html>
<head>
	<style>
		body {
			margin: 0;
			padding: 0;
		}

		table {
			width: 100%;
			height: 100vh;
			border-collapse: collapse;
		}

		td {
			width: 50%;
			border: 1px solid black;
		}
	</style>
</head>
<body>
	<table>
		<tbody>
			<tr>
				<td style="background: #3f122f;">Hello</td>
				<td style="background: #dfccc5;">World!</td>
			</tr>
		</tbody>
	</table>
</body>
</html>
