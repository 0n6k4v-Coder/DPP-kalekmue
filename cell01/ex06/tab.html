<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Simple Responsive Table</title>
	<style>
		table {
			width: 100%;
			border-collapse: collapse;
		}

		td {
			width: 50%;
			border: 1px solid black;
			padding: 10px;
			height: 160px;
		}

		.box {
			box-sizing: border-box;
		}

		@media (max-width: 600px) {
			td {
				display: block;
				width: 100%;
				height: 120px;
			}
		}
	</style>
</head>
<body>
	<table>
		<tbody>
			<tr>
				<td class="box" style="background: #3f122f; color: white;">Hello</td>
				<td class="box" style="background: #dfccc5;">World!</td>
			</tr>
		</tbody>
	</table>
</body>
</html>
