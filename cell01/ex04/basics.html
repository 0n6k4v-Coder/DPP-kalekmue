<!doctype html>
<html>
	<style>
		body {
			background: pink;
		}

		.title {
			color: white;
			text-align: center;
		}

		.img-wrapper {
			display: flex;
			gap: 20px;
		}

		.shop-wrapper {
			width: 640px;
			display: flex;
			flex-direction: column;
		}

		.shop-wrapper img {
			max-width: 100%
			object-fit: contain;
		}

		hr {
			display: block;
			border: 0;
			border-top: 1px solid black;
			margin: 20px 0;
		}

		footer {
			text-align: right;
			font-style: italic;
			font-family: monospace;
			margin: 0;
		}
	</style>
	<head>
		<title>Basics</title>
	</head>
	<body>
		<h1 class="title">Online Shop!!!</h1>
		<div class="img-wrapper">
			<div class="shop-wrapper">
				<img src="nanyang.webp" />
				<a href="https://nanyang.co.th">Nanyang</a>
			</div>
			<div class="shop-wrapper">
				<img src="kokae.png" />
				<a href="https://kohkae.com">Kohkae</a>
			</div>
		</div>
		<hr />
		<footer>
			
		</footer>
	</body>
</html>
